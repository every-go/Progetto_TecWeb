name: Compile Typst PDFs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Typst
        uses: typst-community/setup-typst@v4

      - name: Compile Typst in Relazione/
        run: |
          for file in Relazione/*.typ; do
            [ -e "$file" ] || continue
            name=$(basename "$file" .typ)
            typst compile "$file" "Relazione/$name.pdf"
          done

      - name: Commit and push PDFs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -f Relazione/*.pdf

          if ! git diff --staged --quiet; then
            git commit -m "Auto-compile Typst PDFs [skip ci]"
            git push
          else
            echo "Nessun cambiamento nei PDF."
          fi

      - name: Upload PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-pdfs
          path: Relazione/*.pdf
