<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="./images/ico/logo.ico">
	<title>Login - Casa Otium</title>
	<meta name="keywords" content="Casa Otium, animali, adozione, login, accesso">
	<meta name="description" content="Esegui il login su Casa Otium per eseguire l'accesso">
	<link rel="stylesheet" href="./css/desktop.css" type="text/css">
	<link rel="stylesheet" href="./css/mobile.css" type="text/css" media="screen and (max-width:800px)">
	<link rel="stylesheet" href="./css/print.css" type="text/css" media="print">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Milonga&display=swap" rel="stylesheet">
	<script src="./javascript/login.js" type="module"></script>
	<script src="javascript/menu.js" defer></script>
	<script src="javascript/avviso.js" defer></script>

</head>

<body id="top">
	<a class="aiuti" href="#main-content"> Vai al contenuto </a>
	<header id="container-menu">

		<img src="./images/png/gatto_logo.png" alt="" />
      <h1 id="title">Casa Otium</h1>

		<nav id="menu" aria-label="Menù">
			<button id="hamburger" aria-label="Apri menù">
			</button>
			[listaMenu]
		</nav>
	</header>
	<nav id="breadcrumb" aria-label="Breadcrumb">
		<p>
			Ti trovi in: <a href="index.php" lang="en">Home</a><span aria-hidden="true"> &gt;&gt; </span><span
				lang="en">Login</span>
		</p>
	</nav>

	<main id="main-content">

		[adottaMessage]
		<div id="txt-form">
			<img class="screen-only" src="./images/jpg/cane_login.jpg" alt="" />
			<img class="print-only" src="./images/png/cane_login.png" alt="" />

			<div id="form-reg">
				<form action="login.php?[PAGINA_PROVENIENZA]" method="post" id="login-form">
					<div>
						<label for="username">Inserisci il tuo username:</label>
						<input type="text" id="username" name="username" value="[USERNAME_VALUE]" [autofocusUsername] autocomplete="username" required aria-describedby="errUsername">
						<noscript>
							[errUsername]
						</noscript>
					</div>

					<div>
						<label for="password">Inserisci la tua password:</label>
						<input type="password" id="password" name="password" [autofocusPassword] autocomplete="current-password" required aria-describedby="errPassword">
						<noscript>
							[errPassword]
						</noscript>
					</div>

					<input type="submit" name="login" value="Accedi" aria-describedby="error_message">
					[ERROR_MESSAGE]
				</form>
				<p> Non hai un <span lang="en">account</span>? <a href="registrazione.php?[PAGINA_PROVENIENZA]">Registrati</a></p>
			</div>
		</div>
	</main>

</body>

</html>
