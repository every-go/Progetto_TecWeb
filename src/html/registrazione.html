<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/x-icon" href="./images/ico/logo.ico">
	<title>Registrazione - Casa Otium</title>
	<meta name="keywords" content="Casa Otium, animali, adozione, registrazione, account">

	<link rel="stylesheet" href="./css/desktop.css" type="text/css">
	<link rel="stylesheet" href="./css/mobile.css" type="text/css" media="screen and (max-width:800px)">
	<link rel="stylesheet" href="./css/print.css" type="text/css" media="print">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Milonga&display=swap" rel="stylesheet">
	<script src="javascript/menu.js" defer></script>
	<script src="javascript/avviso.js" defer></script>
	<script src="./javascript/registrazione.js" type="module"></script>
</head>

<body id="top">
	<a class="aiuti" href="#main-content"> Vai al contenuto </a>
	<header id="container-menu">
		<a href="./index.php" tabindex="-1"><img src="./images/png/gatto_logo.png" alt="" /></a>
      <h1 id="title">Casa Otium</h1>  

		<nav id="menu" aria-label="Menù">
			<button id="hamburger" aria-label="Apri menù">
			</button>
			[listaMenu]
		</nav>
	</header>
	<nav id="breadcrumb" aria-label="percorso">
		<p>
			Ti trovi in: <a href="index.php" lang="en">Home</a><span aria-hidden="true"> &gt;&gt; </span><a
				href="login.php?[PAGINA_PROVENIENZA]"><span lang="en">Login</span></a><span aria-hidden="true"> &gt;&gt;
			</span>Registrazione
		</p>
	</nav>
	<main id="main-content">

		<div id="txt-form">
			<img class="screen-only" src="./images/jpg/cani.jpg" alt="" />
			<img class="print-only" src="./images/png/cani.png" alt="" />

			<div id="form-reg">
				<form action="registrazione.php?[PAGINA_PROVENIENZA]" method="post" id="login-form">

					<div>
						<label for="username">Inserisci il tuo <span lang="en">username:</span></label>
						<input 
							type="text" id="username" 
							name="username" 
							value="[USERNAME_VALUE]" 
							[autofocusUsername] 
							required 
							aria-describedby="errUsername"
							autocomplete="off"
						/>
						<div class="errorSuggestion" role="alert" id="errUsername">
							<noscript>
								[errUsername]
							</noscript>
						</div>
					</div>

					<div>
						<label for="password">Inserisci la tua <span lang="en">password:</span></label>
						<input 
							type="password" 
							id="password" 
							name="password" 
							[autofocusPassword] 
							required 
							aria-describedby="errPassword" 
							autocomplete="off"
						/>
						<div class="errorSuggestion" role="alert" id="errPassword">
							<noscript>
								[errPassword]
							</noscript>
						</div>
					</div>

					<div>
						<label for="confirm_password">Conferma la tua <span lang="en">password:</span></label>
						<input 
							type="password" 
							id="confirm_password" 
							name="confirm_password" 
							required 
							aria-describedby="errConfirmPassword" 
							autocomplete="off"
						/>
						<div class="errorSuggestion" role="alert" id="errConfirmPassword">
							<noscript>
								[errConfirmPassword]
							</noscript>
						</div>
					</div>

					<div class="form-group">
						<input type="submit" name="register" value="Registrati" aria-describedby="error_message" />
					</div>
					<div class="errorSuggestion" role="alert" id="error_message">[ERROR_MESSAGE]</div>
				</form>

				<p> Hai già un <span lang="en">account</span>? <a href="login.php?[PAGINA_PROVENIENZA]">Esegui il <span lang="en">login</span></a></p>
			</div>
		</div>
	</main>

</body>

</html>
